<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>FoxyPay</title><meta name="robots" content="noindex">
<script>
// GitHub Pages não tem rotas: /verificar/FXP-2026-000127 cai aqui e vai para a página de verificação com o número na query.
(function(){var m=location.pathname.match(/^\/verificar\/(FXP-\d{4}-\d{6})\/?$/); if(m){location.replace("/verificar/?n="+m[1]+(location.search?"&"+location.search.slice(1):""));} else {location.replace("/");}})();
</script></head><body></body></html>
